# cargo-nextest's profiles for this repository (tools/mutants/check.py).

[profile.mutants]
# A mutant's tests stop at the first that fails: a caught mutant costs the
# tests up to its first catcher. Each test in its own process.
fail-fast = true
# A test still running at 5 s hangs (the slowest takes under 1 s): killed
# and named, where a hang used to cost the whole suite's timeout.
slow-timeout = { period = "5s", terminate-after = 1 }
# Each test's line once, as it ends, with its outcome and time.
status-level = "all"
final-status-level = "none"

[profile.mutants-map]
# As `mutants`, but every test runs on every mutant: the record names every
# test that catches each one, with its time (check.py --map).
fail-fast = false
slow-timeout = { period = "5s", terminate-after = 1 }
status-level = "all"
final-status-level = "none"
