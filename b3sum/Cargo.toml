# Published as b3sums (b3sum is official BLAKE3's on crates.io); the
# program it installs is b3sum.
[package]
name = "b3sums"
version = "0.8.0+dev"
authors = ["Jack O'Connor <oconnor663@gmail.com>", "John Servil"]
description = "b3sum, the BLAKE3 command-line hasher, on blake3-servil: the same digests, faster"
repository = "https://github.com/servil-software-factory/BLAKE3"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
readme = "README.md"
edition = "2024"

[[bin]]
name = "b3sum"
path = "src/main.rs"

[features]

[dependencies]
anyhow = "1.0.25"
blake3 = { version = "=0.8.0+dev", path = "../threads", package = "blake3-servil" }
clap = { version = "4.0.8", features = ["derive", "wrap_help"] }
hex = "0.4.0"
# --sigilcode: each hash as a sigil (johnservil/sigil), its full version pinned.
sigilcode = "=0.1.0+81af550bfd3eb2aff85c3ddf0a21446e78a1809d"

# A file already in the page cache is mapped and hashed in place.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
memmap2 = "0.9"

[dev-dependencies]
duct = "1.0.0"
tempfile = "3.1.0"
