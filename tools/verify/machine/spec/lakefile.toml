name = "spec"
defaultTargets = ["HexText", "HexContract", "StackBytesLemmas", "PushContract", "MergeContract", "LevelsContract", "HashContract"]

# The specification (C2SP's BLAKE3 in Lean).
[[require]]
name = "Blake3"
path = "../../../../c2sp/BLAKE3"

[[lean_lib]]
name = "HexText"

# The algorithm over the specification (`Blake3.CV`, the tree's stack): the file of ../alg.
[[lean_lib]]
name = "Stack"
srcDir = "../alg"

# A chunk as a fold over its blocks and the output's first 32 bytes: also a file of ../alg.
[[lean_lib]]
name = "Chunk"
srcDir = "../alg"

[[lean_lib]]
name = "Contract"

[[lean_lib]]
name = "StackBytes"

[[lean_lib]]
name = "PushContract"

[[lean_lib]]
name = "HexContract"

[[lean_lib]]
name = "MergeContract"

[[lean_lib]]
name = "LevelsContract"

[[lean_lib]]
name = "StackBytesLemmas"

[[lean_lib]]
name = "HashContract"
