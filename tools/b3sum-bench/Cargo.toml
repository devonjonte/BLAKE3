[package]
name = "b3sum-bench"
version = "0.1.0"
edition = "2024"
description = "How long b3sum takes to hash files, start to exit: builds and ways of reading files compared, reproducibly"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
publish = false

[dependencies]
clocks = { path = "../../clocks" }
# Names each contender's executable by its digest in the samples file.
blake3-servil = { path = "../..", default-features = false }

[profile.release]
debug = 1
