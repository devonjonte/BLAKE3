name: proofs that take hours

# Hours of Arm time and up to about 60 GB, past GitHub's hosted runners:
# every SME2 kernel at every group count (the chunk and parent kernels'
# inductions are what the SME2 contracts in the Rust and whole-call proofs
# rest on), and the Rust paths and whole calls with the instruction models
# they run checked against the CPU. It runs on the fork's VM, whose
# runner takes this one job and exits: tools/runner/long-proofs.sh
# BRANCH registers it, dispatches this workflow, and runs it, before each
# promotion that changes the code or the verify tools.
on: workflow_dispatch

jobs:
  long_proofs:
    name: the long proofs, on the fork's VM
    runs-on: vm-long
    timeout-minutes: 1440
    steps:
    - uses: actions/checkout@v4
    - name: every SME2 kernel, the chunk, parent, extended-output, and message kernels at every group count
      run: pypy3 tools/verify/prove_sme2.py chunks chunks_at messages parents xof every parents_every xof_every messages_every
    - name: the Rust paths and whole calls proved; the instruction models agree with the CPU
      run: pypy3 tools/verify/cross_check.py
