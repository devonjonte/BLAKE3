name: tests

on:
  # Started by hand for a promotion candidate that touches code for other
  # targets (x86, Windows), and for every fork's pull
  # request; the AArch64 builds and proofs run on the VM and the Mac
  # (CONTRIBUTING.md: tools/check-builds.sh, tools/verify/long-proofs.sh).
  pull_request:
  workflow_dispatch:

# A newer run on a branch supersedes its running tests.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BLAKE3_CI: "1"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  # Every crate in the tree formatted by rustfmt.toml at the root.
  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: cargo fmt --check, in each crate
      run: for d in $(git ls-files '*Cargo.toml' | xargs -n1 dirname); do (cd "$d" && cargo fmt --all -- --check) || exit 1; done

  library_tests:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.target.name }} ${{ matrix.channel }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86 alone: the AArch64 builds run on the VM and the Mac
        # (tools/check-builds.sh and the suites), where the x86 feature
        # flags below would build the same code each time.
        target: [
          { "os": "ubuntu-latest",    "toolchain": "x86_64-unknown-linux-gnu",  "name": "Linux GNU" },
          { "os": "windows-latest",   "toolchain": "x86_64-pc-windows-msvc",    "name": "Windows MSVC" }
        ]
        channel: ["stable", "nightly"]

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ format('{0}-{1}', matrix.channel, matrix.target.toolchain) }}
    - uses: taiki-e/install-action@nextest
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-c@0.10.26
    # Print the compiler version, for debugging.
    - name: print compiler version
      run: cargo run --quiet
      working-directory: ./tools/compiler_version
    # Print out instruction set support, for debugging.
    - name: print instruction set support
      run: cargo run --quiet
      working-directory: ./tools/instruction_set_support
    # The tests run under cargo-nextest, each in its own process (AGENTS:
    # "Tests run under nextest"); the doc examples under cargo test --doc.
    # Default tests plus the optional trait implementations (every public
    # feature).
    - run: cargo nextest run --features=serde,zeroize
    - run: cargo test --doc --features=serde,zeroize
    # no_std tests.
    - run: cargo nextest run --no-default-features
    - name: Make sure enabling LTO via CFLAGS doesn't break the build.
      run: cargo build --tests
      if: matrix.target.toolchain != 'x86_64-pc-windows-msvc'
      env:
        CFLAGS: -flto

    # Each level of SIMD support, with assembly and with pure Rust
    # intrinsics, in the test profile (optimized, its assertions
    # and overflow checks on: Cargo.toml); the release profile once, at full
    # support, for the optimizer's own behavior.
    #
    # Full SIMD support.
    - run: cargo nextest run --features=
    - run: cargo nextest run --features=pure
    - run: cargo nextest run --features= --release
    - run: cargo nextest run --features=pure --release
    # No AVX-512.
    # No AVX2.

    # Test vectors.
    - name: test vectors
      run: cargo nextest run
      working-directory: ./test_vectors
    - name: test vectors pure
      run: cargo nextest run --features=pure
      working-directory: ./test_vectors
    # The C API (capi/: b3.h over the crate).
    - name: C API
      run: cargo nextest run --release
      working-directory: ./capi
    - name: C libraries (Windows MSVC)
      if: runner.os == 'Windows'
      run: cargo cbuild --release
      working-directory: ./capi
    # Reference impl doc test.
    - name: reference impl doc test
      run: cargo test --doc
      working-directory: ./reference_impl

  b3sum_tests:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: b3sum ${{ matrix.target.name }} ${{ matrix.channel }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86 alone: the AArch64 builds run on the VM and the Mac
        # (tools/check-builds.sh and the suites), where the x86 feature
        # flags below would build the same code each time.
        target: [
          { "os": "ubuntu-latest",    "toolchain": "x86_64-unknown-linux-gnu",  "name": "Linux GNU" },
          { "os": "windows-latest",   "toolchain": "x86_64-pc-windows-msvc",    "name": "Windows MSVC" }
        ]
        channel: ["stable", "nightly"]

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ format('{0}-{1}', matrix.channel, matrix.target.toolchain) }}
    - uses: taiki-e/install-action@nextest
    # Test b3sum.
    - name: test b3sum
      run: cargo nextest run
      working-directory: ./b3sum
    - name: test b3sum --no-default-features
      run: cargo nextest run --no-default-features
      working-directory: ./b3sum
    - name: Make sure enabling LTO via CFLAGS doesn't break the build.
      run: cargo build
      if: matrix.target.toolchain != 'x86_64-pc-windows-msvc'
      env:
        CFLAGS: -flto
      working-directory: ./b3sum

  aarch64_without_sme2:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The AArch64 paths our machines (an M4 Max and a VM on it) never run:
    # a CPU without SME2 (this runner, a Neoverse N2), and one without the
    # SHA-3 extension either (QEMU as a Cortex-A72, as in a Raspberry Pi 4
    # or a Graviton 2), whose detection then picks the plain NEON kernels.
    name: "AArch64 without SME2, and without SHA-3 (QEMU Cortex-A72)"
    runs-on: ubuntu-24.04-arm
    # Clang assembles the SME2 kernel, which this build carries as users'
    # do (GCC 13 here cannot); detection then leaves it out.
    env:
      CC: clang
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@nextest
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-c@0.10.26
    - run: cargo nextest run --lib --tests --features=serde,zeroize
    # QEMU 11.1.2, Debian's static build, pinned by its SHA-256 and BLAKE3
    # hashes: the runner's own (Ubuntu's 8.2.2) crashed itself now and then
    # emulating a test's intended panic (#113).
    - name: QEMU 11.1.2
      run: |
        curl -sSfLO http://deb.debian.org/debian/pool/main/q/qemu/qemu-user_11.1.2+ds-3_arm64.deb
        echo "e278d393447a97b548728918af8e395a33086f5b7100138e38cf06a41766612e  qemu-user_11.1.2+ds-3_arm64.deb" | sha256sum -c
        echo "7c3f49bb0945cf7e2148480118a34dc34ef1641cf5f83f0137996b78f2202945  qemu-user_11.1.2+ds-3_arm64.deb" > qemu.b3
        cargo run -q --release --manifest-path b3sum/Cargo.toml -- -c qemu.b3
        ar x qemu-user_11.1.2+ds-3_arm64.deb data.tar.xz && tar xJf data.tar.xz ./usr/bin/qemu-aarch64
        sudo install usr/bin/qemu-aarch64 /usr/local/bin/qemu-aarch64 && qemu-aarch64 --version
    - run: cargo nextest run --lib --tests --features=serde,zeroize
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
    - name: C API
      run: cargo nextest run --release
      working-directory: ./capi

  capi_macos:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: "C API on macOS (installed consumers)"
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@nextest
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-c@0.10.26
    - run: brew install pkg-config
    # The same installed-consumer test as on Linux: shared and static
    # installations, pkg-config flags, C11 and C++11 callers.
    - name: C API
      run: cargo nextest run --release --manifest-path capi/Cargo.toml

  capi_windows_consumer:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: "C API consumer on Windows MSVC"
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-c@0.10.26
    - uses: ilammy/msvc-dev-cmd@v1
    - name: install the C library
      run: cargo cinstall --release --manifest-path capi/Cargo.toml --destdir=${{ runner.temp }}/b3-stage --prefix=/b3-capi-test --libdir=lib
    - name: build and run C and C++ consumers (static, then shared)
      shell: pwsh
      run: |
        $inc = "${{ runner.temp }}/b3-stage/b3-capi-test/include"
        $lib = "${{ runner.temp }}/b3-stage/b3-capi-test/lib"
        cl /nologo /std:c11 /W4 /WX /I $inc capi/tests/check.c /link /LIBPATH:$lib b3_servil.lib ws2_32.lib ntdll.lib userenv.lib /OUT:${{ runner.temp }}/check-static.exe
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cl /nologo /std:c11 /W4 /WX /I $inc capi/tests/check.c /link /LIBPATH:$lib b3_servil.dll.lib /OUT:${{ runner.temp }}/check-shared.exe
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cl /nologo /EHsc /W4 /WX /I $inc capi/tests/check.cpp /link /LIBPATH:$lib b3_servil.lib ws2_32.lib ntdll.lib userenv.lib /OUT:${{ runner.temp }}/check-cpp.exe
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $env:PATH = "$lib;$env:PATH"
        foreach ($exe in @("check-static", "check-shared", "check-cpp")) {
          $out = & "${{ runner.temp }}/$exe.exe" 2>&1
          $code = $LASTEXITCODE
          Write-Host "$exe exit $code"
          Write-Host "$out"
          if ($code -ne 0) { exit 1 }
          if ($exe -ne "check-cpp" -and "$out" -notmatch "stream ok") { Write-Error "$exe did not print stream ok"; exit 1 }
        }

  # The oldest GCC supported (CONTRIBUTING.md): Debian 12's, the oldest in a
  # supported distribution (Debian 11's support ended in August 2026). Older compilers are unsupported (GCC 5.4's
  # assembler rejects the AVX-512 code GCC 5.4 itself emits at -O3; GCC 5
  # was superseded in 2016). Upstream's reason for an old-GCC job:
  # https://github.com/BLAKE3-team/BLAKE3/issues/271. The runner may lack
  # AVX-512; the build is the check that holds on every runner.
  gcc_floor:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: "compile and test with GCC 12, the oldest supported"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: addnab/docker-run-action@v3
      with:
        image: gcc:12
        options: -v ${{ github.workspace }}:/work
        run: |
          cat /proc/cpuinfo
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
          cd /work
          ~/.cargo/bin/cargo nextest run
          ~/.cargo/bin/cargo test --doc

  miri_smoketest:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Miri smoketest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - uses: taiki-e/install-action@nextest
    # Currently the test search "miri" only matches "test_miri_smoketest", but
    # we might add more. If this accidentally picks up anything incompatible or
    # slow, we can narrow it.
    # The pool's and the queue's threads live for the whole process, and
    # the queue's test uses several of them.
    - run: cargo miri nextest run miri
      env:
        MIRIFLAGS: "-Zmiri-num-cpus=4 -Zmiri-ignore-leaks"


  x86_model:
    # A pull request from a branch of this repository: its push runs CI already.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: "the x86-64 proofs' model against the CPU"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # GitHub's runners vary: the AVX-512 forms are checked on those that
    # have AVX-512, and this line says which this one is.
    - run: grep -o -w 'avx512f\|avx512vl\|avx2\|sse4_1' /proc/cpuinfo | sort -u
    - run: sudo apt-get install -y llvm lld clang && pip install z3-solver
    - run: python3 tools/verify/cross_check_x86.py
