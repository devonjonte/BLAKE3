[package]
name = "blake3-servil"
version = "0.8.0+dev"
authors = ["John Servil", "Devon Jonte", "Sam Shackleton"]
description = "the BLAKE3 hash function on every core: blake3-servil-core's kernels behind a shared thread pool"
repository = "https://github.com/servil-software-factory/BLAKE3"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
edition = "2024"
include = ["/src", "/build.rs", "/blake3_gpu.*", "/LICENSE_*"]

[features]
# 0.8's dependents name `std`; this crate always needs it (TRIAL: to go
# with the bench's line, bench-hashes #169).
default = ["std"]
std = []
# The core's optional trait implementations, passed on.
serde = ["blake3-servil-core/serde"]
zeroize = ["blake3-servil-core/zeroize"]

[dependencies]
# The one-thread library: the kernels and their proofs, the Hasher, the
# direct and grouped calls. This crate re-exports it whole.
blake3-servil-core = { version = "=0.8.0+dev", path = ".." }
arrayvec = { version = "0.7.4", default-features = false }

[build-dependencies]
cc = "1.1.12"

[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dev-dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
rand = "0.10.0"
hex = "0.4.2"
tempfile = "3.8.0"
serde_json = "1.0.107"
# tests/shuttle_*.rs: the pool's handshakes under a model checker.
shuttle = "0.8"

# The profiles the root's crate has, for this crate's own builds (a crate
# outside a workspace reads its own): tests optimized with their checks on,
# and tools/mutants/check.py's incremental release build.
[profile.test]
opt-level = 3
codegen-units = 16
incremental = false
debug = false
debug-assertions = true
overflow-checks = true

[profile.mutants]
inherits = "release"
incremental = true
